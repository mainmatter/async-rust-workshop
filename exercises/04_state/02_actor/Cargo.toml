[package]
name = "state_actor"
version.workspace = true
default-run = "server"
edition.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[dev-dependencies.criterion]
workspace = true
features = ["async_tokio"]

[[bench]]
name = "store"
harness = false
test = false
